[project]
name = "freezetime"
version = "0.1.0"
description = "CS2 demo analyzer built on awpy 3"
requires-python = ">=3.11"
dependencies = ["awpy>=3.1", "polars", "matplotlib", "typer", "fastapi", "uvicorn", "zstandard; python_version < '3.14'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
freezetime = "freezetime.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["freezetime", "freezetime.maps", "freezetime.app"]

[tool.setuptools.package-data]
"freezetime.maps" = ["*.json"]
"freezetime.app" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
